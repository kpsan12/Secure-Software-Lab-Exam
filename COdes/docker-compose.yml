version: "3.8"
services:
  chatbot:
    build: .
    image: ai-chatbot-wrapper:local
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      retries: 3
